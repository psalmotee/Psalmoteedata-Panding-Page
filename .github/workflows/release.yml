name: Build and Release WordPress Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build

      - name: Verify required files
        run: |
          test -f psalmoteedata-landing.php
          test -f templates/psalmotee-landing-template.php
          test -f plugin-update-checker/plugin-update-checker.php
          test -f dist/.vite/manifest.json

      - name: Package WordPress plugin
        run: |
          mkdir -p release/psalmoteedata-landing

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='release/' \
            --exclude='src/' \
            --exclude='public/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='vite.config.js' \
            --exclude='tailwind.config.js' \
            --exclude='postcss.config.js' \
            --exclude='/index.html' \
            ./ release/psalmoteedata-landing/

          cd release

          zip -qr ../psalmoteedata-landing.zip psalmoteedata-landing

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            psalmoteedata-landing.zip \
            --title "$RELEASE_TAG" \
            --generate-notes